# T2i firmware — chain-loaded by the RTI bootloader at 0x08004000.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_INIT_ARCH_HW_AT_BOOT=y
CONFIG_SOC_RESET_HOOK=y
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n

# I2C2 for the on-board accelerometer (LIS3DH @0x18)
CONFIG_I2C=y

# Display (HX8347 on FSMC) + LVGL
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_Z_MEM_POOL_SIZE=24576
CONFIG_LV_Z_VDB_SIZE=16
CONFIG_MAIN_STACK_SIZE=8192
