# Milestone 1 of the robust plan: prove USB CDC-ACM comes up from OUR firmware
# (the T2i appears as a new serial port on the Mac and streams our text).
# Uses the modern `usbd` device stack (the legacy CONFIG_USB_DEVICE_STACK
# crashed in pre-main init and is deprecated in Zephyr 4.4).
#
# Chain-loaded by the RTI bootloader at 0x08004000; hardened for that handoff.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_INIT_ARCH_HW_AT_BOOT=y
CONFIG_SOC_RESET_HOOK=y
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n

# Console plumbing
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# New USB device stack + CDC ACM class. We create/enable the device explicitly
# in main() (not the pre-main auto-init) so a crash is observable via markers.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y

# Rule out a silent stack overflow (MPU + HW stack protection are off): give the
# main thread, the system workqueue, the UDC thread and the ISR stack headroom.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_UDC_STM32_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=2048

CONFIG_PRINTK=y
