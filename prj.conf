# T2i firmware — chain-loaded by the RTI bootloader at 0x08004000.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_INIT_ARCH_HW_AT_BOOT=y
CONFIG_SOC_RESET_HOOK=y
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n

# I2C2 for the on-board accelerometer (LIS3DH @0x18)
CONFIG_I2C=y

# GPIO: EXTI wake interrupts on the keypad rows + accelerometer INT1 (PE5)
CONFIG_GPIO=y

# Display (HX8347 on FSMC) + LVGL
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
# LVGL is ~90% of the image, and Zephyr defaults nearly every widget on. Keep it
# minimal and switch things back on as they are actually used.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=n
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# --- widgets we don't use (default y in Zephyr's LVGL Kconfig) ---
CONFIG_LV_USE_ANIMIMG=n
CONFIG_LV_USE_ARC=n
CONFIG_LV_USE_ARCLABEL=n
CONFIG_LV_USE_BAR=n
CONFIG_LV_USE_BUTTONMATRIX=n
CONFIG_LV_USE_CALENDAR=n
CONFIG_LV_USE_CANVAS=n
CONFIG_LV_USE_CHART=n
CONFIG_LV_USE_CHECKBOX=n
CONFIG_LV_USE_DROPDOWN=n
CONFIG_LV_USE_IMAGEBUTTON=n
CONFIG_LV_USE_KEYBOARD=n
CONFIG_LV_USE_LED=n
CONFIG_LV_USE_LINE=n
CONFIG_LV_USE_LIST=n
CONFIG_LV_USE_MENU=n
CONFIG_LV_USE_MSGBOX=n
CONFIG_LV_USE_ROLLER=n
CONFIG_LV_USE_SCALE=n
CONFIG_LV_USE_SLIDER=n
CONFIG_LV_USE_SPAN=n
CONFIG_LV_USE_SPINBOX=n
CONFIG_LV_USE_SPINNER=n
CONFIG_LV_USE_SWITCH=n
CONFIG_LV_USE_TABLE=n
CONFIG_LV_USE_TABVIEW=n
CONFIG_LV_USE_TEXTAREA=n
CONFIG_LV_USE_TILEVIEW=n
CONFIG_LV_USE_WIN=n
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_LV_Z_VDB_SIZE=16
CONFIG_MAIN_STACK_SIZE=8192
